services:
  django:
    container_name: django
    env_file:
      - .env
    build:
      context: .
    working_dir: /studigo
    #poetry run gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application"
    command: >
      sh -c "poetry install --no-interaction --no-ansi --no-root &&
             poetry run python manage.py migrate &&
             poetry run python manage.py collectstatic --noinput &&
             poetry run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/studigo
      - static_volume:/studigo/staticfiles
      - media_volume:/studigo/media
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: studigo_nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - django
    volumes:
      - ./resources/nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/studigo/staticfiles
      - media_volume:/studigo/media
    networks:
      - ws

  db:
    image: postgres:14
    container_name: studigo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw1234
      POSTGRES_ROOT_USER: postgres
      POSTGRES_DB: studigo
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ws
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    container_name: studigo_redis
    ports:
      - "6379:6379"
    networks:
      - ws
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ws:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  postgres_data: