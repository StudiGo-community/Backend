name: Deploy to EC2
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Docker 이미지 빌드 & Push
      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ secrets.DJANGO_CONTIANER_TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ secrets.DJANGO_CONTIANER_TAG }}

      # 3. CI 환경 IP 가져오기
      - name: get GitHub Actions IP
        id: ip
        uses: haythem/public-ip@v1.3
      
      # 4. AWS 크레덴셜 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 5. AWS CLI로 EC2인스턴스에 연결된 보안그룹에 SSH 접속 허용 인바운드 규칙 추가
      - name: Add GitHub IP to AWS
        run: |
          aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # 6. SSH로 EC2에 배포
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            
            cat > .env << 'ENVEOF'
            ${{ secrets.DJANGO_ENVS }}
            ENVEOF
            
            docker compose up django -d --pull always --no-deps 
            
            docker image prune -af
            
            echo "✅ Deployment completed!"

      # 7. GitHub Actions CI 환경 IP에 대한 SSH 접속 허용 규칙을 EC2 보안그룹 인바운드 규칙에서 제거
      - name: Remove GitHub IP from AWS SG
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
            --region ap-northeast-2
