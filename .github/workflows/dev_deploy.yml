name: Deploy to EC2
on:
  push:
    branches:
      - develop

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: studigo-django        # ECR 리포지토리 이름
  ECS_SERVICE: studigo-service          # ECS 서비스 이름
  ECS_CLUSTER: studigo-cluster          # ECS 클러스터 이름
  CONTAINER_NAME: django-container      # Task Definition의 컨테이너 이름

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Docker 이미지 빌드 & Push
      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }} \
          .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }}

      # 3. SSH로 EC2에 배포
      - name: Deploy to EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          # SSH 키 설정
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # EC2에 접속해서 배포
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $USER@$HOST << 'EOF'
            
            # 환경변수 파일 생성
            cat > ~/app/.env << 'ENVEOF'
            ${{ secrets.DJANGO_ENVS }}
            ENVEOF
            
            # Docker 네트워크 생성 (없으면)
            docker network create ws 2>/dev/null || true
            
            # 기존 컨테이너 정리
            docker stop django 2>/dev/null || true
            docker rm django 2>/dev/null || true
            
            # 최신 이미지 가져오기
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
            
            # 새 컨테이너 실행
            docker run -d \
              --name django \
              --network ws \
              --restart unless-stopped \
              -p 8000:8000 \
              -v static-volume:/studigo/staticfiles \
              -v media-volume:/studigo/media \
              --env-file ~/app/.env \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest \
              sh -c "python manage.py migrate && \
                     python manage.py collectstatic --noinput && \
                     gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application"
            
            # 오래된 이미지 정리
            docker image prune -af
            
            echo "✅ Deployment completed!"
          EOF